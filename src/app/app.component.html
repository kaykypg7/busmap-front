<div class="container">
  <app-header [title]="title" subtitle="Acompanhe os ônibus em tempo real"></app-header>

  <div class="busca-section">
    <app-search-bar [(termoBusca)]="termoBusca" [carregando]="carregando" [mapaCarregado]="mapaCarregado"
      (buscar)="buscarLinhas()">
    </app-search-bar>

    <app-info-bar [quantidadeMarcadores]="mapService.obterQuantidade()" [totalBuscas]="totalBuscas"
      [mapaCarregado]="mapaCarregado" (limparMarcadores)="removerMarcadores()">
    </app-info-bar>
  </div>

  <app-map [carregando]="carregando" [mapaCarregado]="mapaCarregado">
  </app-map>

  <div class="debug-info" *ngIf="!mapaCarregado || ultimoErro">

    <div *ngIf="!mapaCarregado" class="debug-item">
      ⚠️ Mapa ainda não carregou
    </div>
    <div *ngIf="ultimoErro" class="debug-item error">
      ❌ {{ ultimoErro }}
    </div>
  </div>
</div>
